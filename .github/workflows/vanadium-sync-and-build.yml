name: Vanadium Sync & Build

on:
  schedule:
    # GrapheneOS saatine göre (ET) öğle arası (~16:00 UTC) ve mesai bitimi (~21:00 UTC)
    - cron: '0 16,21 * * *'
  workflow_dispatch: # Manuel tetikleme

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.sync_step.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        id: sync_step
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Bozuk upstream kaydı varsa temizle
          git remote remove upstream 2>/dev/null || true
          
          # Upstream olarak GrapheneOS/Vanadium ekle ve çek
          git remote add upstream https://github.com/GrapheneOS/Vanadium.git
          git fetch upstream
          
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            git merge upstream/main --no-edit
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Güncelleme yok, derleme atlanıyor."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    # Sadece yeni commit varsa veya manuel tetiklendiyse çalışır
    if: needs.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 40000
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ninja-build curl git python3-pip openjdk-17-jdk

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium Source
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          rm -f .gclient
          mkdir -p chromium_src && cd chromium_src
          fetch --nohooks android
          gclient sync --with_branch_heads --with_tags

      - name: Apply Vanadium Patches
        run: |
          cp -r patches/ chromium_src/src/
          cd chromium_src/src
          for p in ../patches/*.patch; do patch -p1 < "$p"; done

      - name: Build Vanadium Browser and WebView
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          cd chromium_src/src
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false is_official_build=true proprietary_codecs=true ffmpeg_branding="Chrome"'
          autoninja -C out/Default trichrome_chrome_apk trichrome_webview_apk

      - name: Prepare APKs for Release
        run: |
          mkdir -p release_apks
          cp chromium_src/src/out/Default/apks/TrichromeChrome.apk release_apks/Vanadium.apk
          cp chromium_src/src/out/Default/apks/TrichromeWebView.apk release_apks/VanadiumWebView.apk

      - name: Generate Release Tag
        id: tag
        run: echo "tag_name=v$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Vanadium Gecelik Derleme (${{ steps.tag.outputs.tag_name }})
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
