- name: Sync upstream changes
        id: sync_step
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Uzak depo zaten ekliyse hata vermesini önlemek için || true eklenmiştir
          git remote add upstream https://github.com/GrapheneOS/Vanadium.git || git remote set-url upstream https://github.com/GrapheneOS/Vanadium.git
          git fetch upstream
          
          # Güncelleme olup olmadığını kontrol et
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            git merge upstream/main --no-edit
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Güncelleme yok, derleme atlanıyor."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
