name: Sync with Upstream

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı tam saatte çalışır (Örn: 14:00, 15:00)
  workflow_dispatch: # İhtiyaç duyduğunda "Actions" sekmesinden anında elle tetiklemene olanak tanır

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main 

      - name: Sync upstream changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git remote add upstream https://github.com/GrapheneOS/Vanadium.git
          
          git fetch upstream
          
          git merge upstream/main --no-edit 
          
          git push origin main
